server {
    listen 80;
    listen [::]:80;
    server_name sfhyl.cn;
    root /www/wwwroot/sfhyl.cn;

    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name sfhyl.cn;
    root /opt/sfhyl-platform/current/website;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/sfhyl.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sfhyl.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 500m;
    client_body_timeout 600s;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/json application/javascript application/xml image/svg+xml text/css text/plain;

    location = /admin {
        return 301 /admin/;
    }

    location = /admin/index.html {
        alias /opt/sfhyl-platform/current/admin/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location ^~ /admin/ {
        alias /opt/sfhyl-platform/current/admin/;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }

    location ^~ /api/v1/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_request_buffering off;
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
    }

    location ^~ /media/ {
        proxy_pass http://127.0.0.1:9200/sfhyl/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Revalidate mutable media so deleting an asset is reflected immediately.
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
        access_log off;
    }

    location ^~ /uploads/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # The React /about route shares its name with the default media directory.
    location = /about {
        try_files /index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location = /about/ {
        try_files /index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location ^~ /about/ {
        try_files $uri =404;
    }

    location ^~ /cars/ {
        try_files $uri =404;
    }

    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    location ~* /(\.git|\.env|node_modules|package(-lock)?\.json|pnpm-lock\.yaml) {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /www/wwwlogs/sfhyl.cn.log;
    error_log /www/wwwlogs/sfhyl.cn.error.log;
}
