name: sfhyl-platform

services:
  api:
    image: sfhyl-api:local
    build:
      context: .
      dockerfile: apps/api-server/Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      api-migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      TZ: ${TZ:-Asia/Shanghai}
      HOST: 0.0.0.0
      PORT: 3002
      API_PREFIX: api/v1
      DATABASE_URL: mysql://${MYSQL_USER:-sfhyl}:${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}@mysql:3306/${MYSQL_DATABASE:-sfhyl}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://sfhyl.cn,https://admin.sfhyl.cn}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:-}
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:-admin}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-5}
      LOGIN_LOCK_MINUTES: ${LOGIN_LOCK_MINUTES:-15}
      GLOBAL_RATE_LIMIT_TTL_MS: ${GLOBAL_RATE_LIMIT_TTL_MS:-60000}
      GLOBAL_RATE_LIMIT_MAX: ${GLOBAL_RATE_LIMIT_MAX:-120}
      LOGIN_RATE_LIMIT_MAX: ${LOGIN_RATE_LIMIT_MAX:-5}
      CAPTCHA_PROVIDER: ${CAPTCHA_PROVIDER:-disabled}
      CAPTCHA_SECRET: ${CAPTCHA_SECRET:-}
      CAPTCHA_VERIFY_URL: ${CAPTCHA_VERIFY_URL:-}
      CAPTCHA_VERIFY_TIMEOUT_MS: ${CAPTCHA_VERIFY_TIMEOUT_MS:-8000}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_PUBLIC_URL: ${STORAGE_PUBLIC_URL:-https://sfhyl.cn/uploads}
      LOCAL_STORAGE_PATH: /app/storage
      MINIO_ENDPOINT: ${MINIO_INTERNAL_ENDPOINT:-minio}
      MINIO_PORT: ${MINIO_INTERNAL_PORT:-9000}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-}
      MINIO_BUCKET: ${MINIO_BUCKET:-sfhyl}
      MINIO_REGION: ${MINIO_REGION:-}
      MINIO_PATH_STYLE: ${MINIO_PATH_STYLE:-true}
      MINIO_SESSION_TOKEN: ${MINIO_SESSION_TOKEN:-}
      MINIO_PUBLIC_READ: ${MINIO_PUBLIC_READ:-false}
      ALIYUN_OSS_ENDPOINT: ${ALIYUN_OSS_ENDPOINT:-}
      ALIYUN_OSS_REGION: ${ALIYUN_OSS_REGION:-}
      ALIYUN_OSS_ACCESS_KEY_ID: ${ALIYUN_OSS_ACCESS_KEY_ID:-}
      ALIYUN_OSS_ACCESS_KEY_SECRET: ${ALIYUN_OSS_ACCESS_KEY_SECRET:-}
      ALIYUN_OSS_BUCKET: ${ALIYUN_OSS_BUCKET:-}
      ALIYUN_OSS_PUBLIC_URL: ${ALIYUN_OSS_PUBLIC_URL:-}
      TENCENT_COS_REGION: ${TENCENT_COS_REGION:-}
      TENCENT_COS_SECRET_ID: ${TENCENT_COS_SECRET_ID:-}
      TENCENT_COS_SECRET_KEY: ${TENCENT_COS_SECRET_KEY:-}
      TENCENT_COS_BUCKET: ${TENCENT_COS_BUCKET:-}
      TENCENT_COS_PUBLIC_URL: ${TENCENT_COS_PUBLIC_URL:-}
      REDIS_ENABLED: ${REDIS_ENABLED:-true}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-sfhyl}
      PUBLIC_CACHE_TTL_SECONDS: ${PUBLIC_CACHE_TTL_SECONDS:-120}
      SYSTEM_LOG_PERSISTENCE_ENABLED: ${SYSTEM_LOG_PERSISTENCE_ENABLED:-true}
      SYSTEM_LOG_FILE: /app/logs/api.jsonl
      SYSTEM_LOG_FILE_MAX_MB: ${SYSTEM_LOG_FILE_MAX_MB:-20}
      SYSTEM_LOG_FILE_MAX_FILES: ${SYSTEM_LOG_FILE_MAX_FILES:-5}
      MEDIA_GENERATE_THUMBNAILS: ${MEDIA_GENERATE_THUMBNAILS:-true}
      MEDIA_THUMBNAIL_WIDTH: ${MEDIA_THUMBNAIL_WIDTH:-480}
      MEDIA_GENERATE_WEBP: ${MEDIA_GENERATE_WEBP:-true}
      MEDIA_IMAGE_MAX_DIMENSION: ${MEDIA_IMAGE_MAX_DIMENSION:-2560}
      MEDIA_WEBP_QUALITY: ${MEDIA_WEBP_QUALITY:-82}
      UPLOAD_MAX_IMAGE_MB: ${UPLOAD_MAX_IMAGE_MB:-15}
      UPLOAD_MAX_VIDEO_MB: ${UPLOAD_MAX_VIDEO_MB:-100}
      HOMEPAGE_DEFAULT_ASSETS_DIR: /app/homepage-defaults
      LEGACY_VEHICLE_ASSETS_DIR: /app/legacy-vehicle-defaults
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      INQUIRY_RATE_LIMIT_TTL_MS: ${INQUIRY_RATE_LIMIT_TTL_MS:-600000}
      INQUIRY_RATE_LIMIT_MAX: ${INQUIRY_RATE_LIMIT_MAX:-5}
      INQUIRY_DUPLICATE_WINDOW_MINUTES: ${INQUIRY_DUPLICATE_WINDOW_MINUTES:-10}
      INQUIRY_NOTIFICATION_EMAIL_ENABLED: ${INQUIRY_NOTIFICATION_EMAIL_ENABLED:-false}
      INQUIRY_NOTIFICATION_WHATSAPP_ENABLED: ${INQUIRY_NOTIFICATION_WHATSAPP_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_TRANSLATION_PROTOCOL: ${OPENAI_TRANSLATION_PROTOCOL:-openai}
      OPENAI_TRANSLATION_MODEL: ${OPENAI_TRANSLATION_MODEL:-gpt-4o-mini}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-SFHYL}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-}
    ports:
      - "127.0.0.1:${API_HOST_PORT:-3002}:3002"
    volumes:
      - sfhyl_local_storage:/app/storage
      - sfhyl_api_logs:/app/logs
    networks:
      - sfhyl_internal
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3002/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  api-migrate:
    image: sfhyl-api:local
    restart: "no"
    command: ["./node_modules/.bin/prisma", "migrate", "deploy"]
    environment:
      NODE_ENV: production
      DATABASE_URL: mysql://${MYSQL_USER:-sfhyl}:${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}@mysql:3306/${MYSQL_DATABASE:-sfhyl}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - sfhyl_internal

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
    environment:
      TZ: Asia/Shanghai
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sfhyl}
      MYSQL_USER: ${MYSQL_USER:-sfhyl}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - sfhyl_mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - sfhyl_internal

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command:
      [
        "sh",
        "-c",
        'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"',
      ]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - sfhyl_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "$$REDIS_PASSWORD" ping | grep PONG']
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - sfhyl_internal

  minio:
    profiles: ["minio"]
    image: ${MINIO_IMAGE:-quay.io/minio/minio:latest}
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-}
    ports:
      - "127.0.0.1:${MINIO_PORT:-9200}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9201}:9001"
    volumes:
      - sfhyl_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - sfhyl_internal

  minio-init:
    profiles: ["minio"]
    image: ${MINIO_MC_IMAGE:-quay.io/minio/mc:latest}
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-}
      MINIO_BUCKET: ${MINIO_BUCKET:-sfhyl}
      MINIO_PUBLIC_READ: ${MINIO_PUBLIC_READ:-false}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        mc alias set local http://minio:9000 "$$MINIO_ACCESS_KEY" "$$MINIO_SECRET_KEY"
        mc mb --ignore-existing "local/$$MINIO_BUCKET"
        if [ "$$MINIO_PUBLIC_READ" = "true" ]; then
          printf '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"AWS":["*"]},"Action":["s3:GetObject"],"Resource":["arn:aws:s3:::%s/*"]}]}' "$$MINIO_BUCKET" > /tmp/public-read.json
          mc anonymous set-json /tmp/public-read.json "local/$$MINIO_BUCKET"
        fi
    networks:
      - sfhyl_internal

networks:
  sfhyl_internal:
    driver: bridge

volumes:
  sfhyl_mysql_data:
  sfhyl_redis_data:
  sfhyl_minio_data:
  sfhyl_local_storage:
  sfhyl_api_logs:
